<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Maze Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        retroBg: '#1e1e2f',
                        retroPanel: '#2a2a40',
                        retroAccent: '#ff477e',
                        retroPath: '#ffeb3b',
                    },
                    fontFamily: {
                        'press-start': ['"Press Start 2P"', 'cursive'],
                        'pretendard': ['Pretendard', 'sans-serif'],
                        'pixel': ['DungGeunMo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Press Start 2P for Retro Feel -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="style.css">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Firebase SDK (Compat Version for CDN usage) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-retroBg text-gray-100 font-pixel min-h-screen flex items-center justify-center">
    <div id="root" class="w-full h-full flex items-center justify-center"></div>

    <!-- App Scripts -->
    <script type="text/babel" src="app.js"></script>
</body>
</html>
